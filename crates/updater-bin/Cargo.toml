[package]
name = "updater-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-config = { path = "../agent-config" }
ureq = { version = "2.9", features = ["tls", "json"] }
rustls-pemfile = "2.1"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
ed25519-dalek = "2.1"
sha2 = "0.11.0"
hex = "0.4.3"
