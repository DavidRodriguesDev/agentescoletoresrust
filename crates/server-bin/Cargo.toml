[package]
name = "server-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
tokio-util = "0.7"
semver = "1.0"
sha2 = "0.10"
axum = { version = "=0.7.9", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
rcgen = "0.13"
clap = { version = "4.4", features = ["derive"] }
ed25519-dalek = "2.1"
base64 = "0.22"
hex = "0.4.3"
