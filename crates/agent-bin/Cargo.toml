[package]
name = "agent-bin"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-core = { path = "../agent-core" }
collector-common = { path = "../collector-common" }
collector-windows = { path = "../collector-windows" }
collector-linux = { path = "../collector-linux" }
agent-config = { path = "../agent-config" }
hostname = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
rpassword = "7.3"
serde_json = "1.0.151"
semver = "1.0.28"
reqwest = { version = "0.13.5", features = ["json"] }
